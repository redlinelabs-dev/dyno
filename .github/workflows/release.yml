# Publishes a release when a version tag (v0.1.0) is pushed: static binaries,
# the install scripts and SHA256SUMS on the GitHub release, and the multi-arch
# image on GHCR (ADR-0024). A tag with a hyphen (v0.2.0-rc.1) makes a GitHub
# prerelease, so the releases/latest/download/ URLs in the docs keep serving
# the last stable release, and it leaves the image's latest tag alone.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  files:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # The tag name reaches the shell through the environment, never spliced
      # into the script text.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: make release VERSION="$TAG"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in the tag makes this a prerelease, which "latest" skips.
          case $TAG in *-*) set -- --prerelease ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes "$@"

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/redlinelabs-dev/dyno
          # The only latest is the raw tag below, which skips prereleases.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
