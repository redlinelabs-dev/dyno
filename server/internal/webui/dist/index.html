<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyno</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15171C; color: #F2EDE2; font: 16px/1.5 system-ui, sans-serif; }
  main { text-align: center; padding: 2rem 1rem; }
  h1 { margin: 0; font-size: 3rem; letter-spacing: .04em; }
  .num { font-size: 4rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #FF5A1F; }
  p { margin: .25rem 0; color: #D8DBE0; }
  small { color: #8a8d93; }
</style>
</head>
<body>
<main>
  <h1>dyno</h1>
  <p>Server is up. The speed test UI arrives in milestone 2.</p>
  <div class="num" id="ping">…</div>
  <p>idle latency, median of <span id="n">20</span> pings</p>
  <small id="ver"></small>
</main>
<script>
// Uses only the public API, like any other client (ADR-0002).
(async () => {
  const plan = await (await fetch("/api/v1/plan", { cache: "no-store" })).json();
  document.getElementById("ver").textContent = `${plan.server.name} ${plan.server.version}`;
  const n = plan.latency.idle_samples, t = [];
  document.getElementById("n").textContent = n;
  await fetch(plan.endpoints.ping, { cache: "no-store" }); // warm the connection
  for (let i = 0; i < n; i++) {
    const s = performance.now();
    await fetch(plan.endpoints.ping, { cache: "no-store" });
    t.push(performance.now() - s);
  }
  t.sort((a, b) => a - b);
  document.getElementById("ping").textContent = `${t[n >> 1].toFixed(1)} ms`;
})().catch((e) => { document.getElementById("ping").textContent = "error"; console.error(e); });
</script>
</body>
</html>
